<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo oscuro -->
  <rect width="100" height="100" fill="#0a0e1a" rx="15"/>
  
  <!-- Grid de cubos TARS (2x2) -->
  <rect x="20" y="20" width="25" height="25" fill="url(#grad)" opacity="1">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="55" y="20" width="25" height="25" fill="url(#grad)" opacity="1">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="20" y="55" width="25" height="25" fill="url(#grad)" opacity="1">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="55" y="55" width="25" height="25" fill="url(#grad)" opacity="1">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Glow effect -->
  <rect x="20" y="20" width="25" height="25" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <rect x="55" y="20" width="25" height="25" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <rect x="20" y="55" width="25" height="25" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <rect x="55" y="55" width="25" height="25" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
</svg>

